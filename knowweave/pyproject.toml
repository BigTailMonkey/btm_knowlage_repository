[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowweave"
version = "0.1.0"
description = "KnoWeave / 知织 —— 以事实为中心的个人 AI 知识库"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "numpy>=2.1.0",
  "httpx>=0.27.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "beautifulsoup4>=4.12.3",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[project.optional-dependencies]
parsing = ["docling>=2"]
ocr = ["pymupdf>=1.24", "pytesseract>=0.3", "Pillow>=10", "rapidocr>=3,<4", "onnxruntime>=1.19"]
asr = ["faster-whisper>=1"]
models = ["FlagEmbedding>=1.3", "sentence-transformers>=4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
