[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# 这里只声明解析边车（sidecar/）需要的 Python 依赖，不再包含任何可安装包。
[project]
name = "knowweave"
version = "0.1.0"
description = "KnoWeave / 知织 —— 解析边车的 Python 依赖环境"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "numpy>=2.1.0",
  "httpx>=0.27.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "beautifulsoup4>=4.12.3",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
parsing = ["docling>=2"]
ocr = ["pymupdf>=1.24", "pytesseract>=0.3", "Pillow>=10", "rapidocr>=3,<4", "onnxruntime>=1.19"]
asr = ["faster-whisper>=1"]
models = ["FlagEmbedding>=1.3", "sentence-transformers>=4"]

[tool.setuptools]
packages = []
