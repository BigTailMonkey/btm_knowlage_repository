[storage]
# 相对路径以项目根目录为基准
data_dir = "data"

[database]
# PostgreSQL 连接地址（必填），例如 postgresql://user:password@127.0.0.1:5432/dbname
url = ""
seed = true

[server]
host = "0.0.0.0"
port = 8730

[time]
timezone = "Asia/Shanghai"

[dsh]
# 嵌入式对话的运行目录；第三方组件见 THIRD_PARTY_NOTICES.md
workspace = "data/dsh-workspace"
# AI 对话使用完整 DSH 原生界面（流式输出、工具、附件与会话管理）；研究台使用 /api/v1/ask
web_enabled = true
web_auto_start = true
# 默认只使用知识库；显式启用后，仍仅在用户要求联网时使用网页补充
web_search_enabled = false
web_port = 3081
web_home = "data/dsh-web-home"

[model]
# 生成、抽取、校验和原生对话共用此处配置的 OpenAI 兼容接口。
provider = "volcengine-ark"
model = "deepseek-v4.1-flash"
api_key = ""
base_url = "https://ark.cn-beijing.volces.com/api/coding/v3"
# 429（限流）/ 5xx / 超时与网络故障在本次调用内自动重试，4xx 参数类错误不重试
# 共重试 retry_max_retries 次（不含首次）：间隔在 retry_base_ms → retry_max_ms 之间等比均匀铺开
# 默认 4 次：2s、4.9s、12.2s、30s，累计约 49s；流式对话只在首个 token 之前重试
retry_max_retries = 4
retry_base_ms = 2000
retry_max_ms = 30000
# 抖动：开启后每次等待取 50%~100% 随机（只会缩短，不会超过封顶）
retry_jitter = false

[embedding]
provider = "volcengine-ark"
base_url = "https://ark.cn-beijing.volces.com/api/coding/v3"
api_key = ""
model = "doubao-embedding-vision"
dim = 1024
path = "/embeddings/multimodal"
instructions = """Target_modality: text.
Instruction: Compress the text into one dense vector for semantic retrieval.
Query:"""
batch_size = 32
timeout_seconds = 30
# 429（限流）/ 5xx / 超时与网络故障自动重试
# 共重试 retry_max_retries 次（不含首次）：间隔在 retry_base_ms → retry_max_ms 之间等比均匀铺开
# 默认 10 次：5s、7.4s、11.1s、16.5s、24.6s、36.6s、54.5s、81.2s、120.9s、180s，累计约 9 分钟
retry_max_retries = 10
retry_base_ms = 5000
retry_max_ms = 180000
# 抖动：开启后每次等待取 50%~100% 随机（只会缩短，不会超过封顶），多分片并发时可避免同时重试
retry_jitter = false

[sidecar]
url = "http://127.0.0.1:8732"
enabled = true
# 由主服务自动拉起与关闭；已在运行则直接复用
auto_start = true
# 解释器路径，相对路径以项目根目录为基准；可选解析/OCR/ASR/本地模型安装见 README
python = "knowweave/.venv/bin/python"

[parsing]
engine = "auto"
min_quality = 0.25

[retrieval]
rerank_threshold = 0.36
# 留空使用规则重排；配置后调用真实语义服务，失败返回错误，不伪装成功
rerank_url = ""
rerank_model = ""
rerank_api_key = ""
semantic_entities = true
grounding_verifier = true
# 本地 BGE-M3 / Cross-Encoder 示例（需先安装 models 可选依赖、下载模型并预热）：
# embedding.provider="hybrid", base_url="http://127.0.0.1:8732", path="/embed",
# model="BAAI/bge-m3", dim=1024, instructions="", timeout_seconds=300
# rerank_url="http://127.0.0.1:8732/rerank", rerank_model="BAAI/bge-reranker-v2-m3"
# 更换向量模型后，对已有文档 POST /api/v1/documents/{id}/reprocess {"scope":"index"}

[reflection]
enabled = true
# 按工作区时区每日运行，重启后补跑；空字符串改为 interval_seconds 间隔
run_at = "03:00"
interval_seconds = 21600

[trash]
# 移入回收站的文档保留天数；到期由每日维护彻底删除，原始文件与派生内容一并清除
# 0 表示不自动清除，只能手动彻底删除
retention_days = 30

[tenant]
default_id = "tn_knowweave"

[prices."deepseek-v4.1-flash"]
input_per_1m = 2.0
output_per_1m = 8.0
currency = "CNY"

[prices."deepseek-chat"]
input_per_1m = 2.0
output_per_1m = 8.0
currency = "CNY"
